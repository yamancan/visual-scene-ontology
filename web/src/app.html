<!doctype html>
<html lang="en" data-mode="dark" data-theme="graphite">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="VSON — drop an image, get a scene graph." />
		<meta name="theme-color" content="#0d0d0d" />
		<link
			rel="preload"
			href="/fonts/geist-variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/fonts/geist-mono-variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<title>vson</title>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('vson-mode');
					var mode = stored === 'light' || stored === 'dark' ? stored : 'dark';
					var theme = mode === 'light' ? 'paper' : 'graphite';
					document.documentElement.setAttribute('data-mode', mode);
					document.documentElement.setAttribute('data-theme', theme);
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.content = mode === 'light' ? '#fbfaf7' : '#0d0d0d';
				} catch (e) {
					/* keep default */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
