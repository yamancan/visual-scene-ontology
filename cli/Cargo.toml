[package]
name = "vson"
version = "1.1.0"
edition = "2021"
rust-version = "1.75"
description = "VSON v1.1 CLI — Penman/Turtle transpilation, SHACL validation, Cypher/caption/FOL export"
license = "Apache-2.0"
repository = "https://github.com/yamancan/visual-scene-ontology"

[[bin]]
name = "vson"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1.19"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
