[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vson-tools"
version = "1.4.0"
description = "Reference transpilers, renderers and verification gates for the Visual Scene Ontology Notation (VSON) v1.3 spec."
readme = "README.md"
license = { file = "LICENSE" }
# 3.9 is the floor because that is the maintainer's system Python; CI runs 3.11.
# Both must stay green, so no 3.10+ syntax in tools/, scripts/ or tests/.
requires-python = ">=3.9"

dependencies = [
    # Turtle/Turtle-star parsing and graph isomorphism (tools/parity_check.py).
    "rdflib>=7.0,<8",
    # SHACL gate (tools/shacl_helper.py, scripts/envelope_check.py).
    "pyshacl>=0.25,<1",
    # OWL 2 RL closure for tools/owlrl_check.py. The >=7.1.4 floor is
    # load-bearing, not cosmetic: owlrl 7.1.4 collapses two trait-kinds on one
    # functional trait property to owl:sameAs (prp-fp) but does NOT expand
    # owl:AllDifferent into owl:differentFrom, so _distinct_sets() hand-rolls
    # the eq-diff1 contradiction check against that exact behaviour
    # (tools/owlrl_check.py:_distinct_sets, tests/test_owlrl_check.py).
    # An older owlrl changes which clashes the gate can see.
    "owlrl>=7.1.4,<8",
    # Envelope schema gate (scripts/deploy_preflight.sh validates a studio
    # envelope against tools/schema/vson-output.schema.json). The 4.0 floor is
    # where jsonschema gained the Draft 2020-12 validator that the schema's
    # $schema declares; without this dependency the preflight gate caught the
    # ImportError and skipped itself, so it asserted nothing.
    "jsonschema>=4.0,<5",
]

[project.optional-dependencies]
# Verification-only. `make grammar-check` extracts the EBNF blocks of
# docs/vson.md Appendix B and Appendix D and generates a parser from them; lark
# is the generator. It is a pure-Python wheel (py3-none-any, ~110 KB, no
# required dependencies of its own, Python >= 3.8), which is why a verification
# gate can depend on it without the runtime doing so: tools/penman and
# tools/vson_x remain pure stdlib, so `pip install vson-tools` to read or write
# VSON still pulls in no parser generator. `make deps` and CI both install this
# extra; the gate exits 2 rather than skipping itself when it is absent.
dev = ["lark>=1.1,<2"]

[tool.setuptools]
# Two packages, one distribution. `tools` is the reference implementation the
# gate matrix runs and docs/vson.md §10 lists; `vson` is the stable import
# surface over it (`import vson; vson.validate(...)`) and holds no second
# implementation of anything. They ship together because `vson` is a facade —
# every call in it lands in `tools`, so a `vson` installed without `tools`
# would import and then fail on first use.
#
# Written out rather than discovered with `packages.find`, because the four
# `tools._data.*` entries below are not importable packages and have no source
# directory of their own: they exist only to give `[tool.setuptools.package-dir]`
# a name to hang an outside-the-package tree on, which is the one declarative
# way setuptools carries such a tree into a wheel. `find` cannot discover a
# package that has no directory, so the two mechanisms do not compose.
# `scripts/check_wheel_install.py` fails if an importable subpackage of `tools`
# or `vson` is ever added and not listed here.
packages = [
    "tools",
    "tools.extractor",
    "tools.extractor.baseline",
    "tools.grammar",
    "tools.importers",
    "tools.metrics",
    "tools.penman",
    "tools.render",
    "tools.vson_x",
    "vson",
    "tools._data.ontology",
    "tools._data.shapes",
    "tools._data.skills",
    "tools._data.cli.src.penman",
]

[tool.setuptools.package-dir]
# The four trees the reference implementation *reads* but does not live in.
# `tools/*.py` anchor them to `__file__` — `ROOT/ontology/vso.ttl` and friends,
# three dirnames up for `routing-tables.json` — which resolves in a checkout and
# in the home the release binary materializes (cli/src/commands/embed.rs), but
# resolves to site-packages/ in a non-editable install, where nothing put them.
#
# setuptools cannot ship a file from outside a package directory *at its
# original path*, so the wheel carries each tree under `tools/_data/` at the
# same repository-relative path beneath it: `tools/_data/ontology/vso.ttl`,
# `tools/_data/cli/src/penman/routing-tables.json`. `tools.resource()` is the
# single resolver that knows both layouts, checkout first. Nothing is
# duplicated in the checkout and no mirror can drift, because the mapping is
# resolved at build time from the originals.
#
# `tools/schema/`, `tools/extractor/prompts/` and `tools/render/verbs.json` are
# absent from this table on purpose: they already live inside the `tools`
# package directory, so plain package-data ships them at the very path the
# readers compute, and no fallback is involved.
"tools._data.ontology" = "ontology"
"tools._data.shapes" = "shapes"
"tools._data.skills" = "skills"
"tools._data.cli.src.penman" = "cli/src/penman"

[tool.setuptools.package-data]
"tools" = ["schema/*.json"]
"tools.extractor" = ["prompts/specialized/*.md"]
"tools.render" = ["verbs.json"]
"tools._data.ontology" = ["*.ttl"]
"tools._data.shapes" = ["*.ttl"]
"tools._data.skills" = ["*/SKILL.md"]
"tools._data.cli.src.penman" = ["routing-tables.json"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Pyflakes (F) plus the pycodestyle errors that catch real defects: E4 imports,
# E7 statement/comparison bugs, E9 syntax/IO errors. This is ruff's classic
# default set, written out explicitly because CI installs ruff unpinned and its
# built-in defaults widen between releases — an implicit default would turn a
# ruff upgrade into a surprise CI failure on untouched code.
select = ["E4", "E7", "E9", "F"]
