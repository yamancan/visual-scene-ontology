# Build the `vson` CLI for four platforms on a `v*` tag and attach the binaries
# to that tag's GitHub release, with a SHA256SUMS file beside them.
#
# WHY A HAND-ROLLED MATRIX RATHER THAN cargo-dist. cargo-dist is the shorter
# path to more than this needs, and every extra thing it brings is a thing that
# has to be maintained by one person. It generates this file and then requires
# it to be regenerated — `dist init` writes `[workspace.metadata.dist]` into
# Cargo.toml and a plan the generated workflow must stay in step with, so a
# release becomes "run the generator, read its diff, commit it" instead of
# "push a tag". Its generated workflow pins actions by tag, not by SHA, which
# is the opposite of what ci.yml does one directory over. And its headline
# feature is installers — shell, PowerShell, Homebrew, npm — every one of which
# would advertise a one-line install for a binary that still needs `python3`
# with `pyshacl` on the host (see the notes this workflow publishes). Four
# `cargo build`s and one `gh release upload` is the whole job here; nothing in
# the list above is earned by it.
#
# WHAT IS BUILT. One binary per row of the matrix below, named
# `vson-<version>-<platform>` — the version comes from the tag, so the asset a
# reader downloads carries the number they clicked on.
#
# THIS WORKFLOW IS NOT A GATE. ci.yml decides whether the tree is good; this
# only packages a tag that already passed it. `workflow_dispatch` runs the
# build half alone — no release is created, no asset is published — so the
# matrix can be exercised on a branch before a tag depends on it.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Never cancel a run that may be halfway through uploading assets: a release
# with three of four binaries on it is worse than a release with none.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        # Windows included: every script here is POSIX, and the Git-for-Windows
        # bash on the runner has the `sha256sum` the checksum step needs.
        shell: bash
    strategy:
      # One platform failing must not cancel the other three — the log of what
      # else built is how you tell "the toolchain moved" from "that runner".
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            smoke: true
          # Cross-compiled from the same arm64 runner rather than built on an
          # Intel one: `macos-13` is the last x86_64 image and is on its way
          # out, while the Apple SDK on any macOS runner links both
          # architectures. The cost is that this is the one binary the build
          # cannot run — arm64 runners have no Rosetta — so it is the one row
          # with no smoke test.
          - platform: macos-x86_64
            runner: macos-14
            target: x86_64-apple-darwin
            smoke: false
          # musl, statically linked, so the binary does not carry the runner
          # image's glibc floor to everyone who downloads it. The crate is pure
          # Rust and spawns `python3` with fork/exec, so it needs no dynamic
          # loader at any point.
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            smoke: true
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            smoke: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      # The tag names a version and so does the crate. A tag cut before the
      # version bump would publish `vson-1.4.0-*` binaries that answer `1.3.0`
      # to `--version`, which is a lie told by an artifact rather than by a
      # sentence. Fail here, where deleting the tag is still cheap.
      - name: The tag and the crate must agree on the version
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -eo pipefail
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' cli/Cargo.toml | head -1)"
          if [ "$IS_TAG" != "true" ]; then
            echo "VERSION=$crate" >> "$GITHUB_ENV"
            echo "not a tag — packaging the crate version $crate as a dry run."
            exit 0
          fi
          tagged="${REF_NAME#v}"
          if [ "$tagged" != "$crate" ]; then
            echo "::error::tag $REF_NAME says $tagged, cli/Cargo.toml says $crate."
            exit 1
          fi
          echo "VERSION=$crate" >> "$GITHUB_ENV"

      # --locked, because a release binary is the one build that must be the
      # dependency set that was tested rather than whatever resolved today.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --manifest-path cli/Cargo.toml --target "$TARGET"

      - name: Name the asset, and check that it runs
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          SMOKE: ${{ matrix.smoke }}
        run: |
          set -eo pipefail
          suffix=""
          if [ "$TARGET" = "x86_64-pc-windows-msvc" ]; then suffix=".exe"; fi
          asset="vson-$VERSION-$PLATFORM$suffix"
          mkdir -p dist
          cp "cli/target/$TARGET/release/vson$suffix" "dist/$asset"

          # `--version` is the whole smoke test on purpose: it is the one
          # subcommand that needs neither Python nor a checkout, so it answers
          # "did this binary link and start" without answering it with a
          # missing `pyshacl` on the runner.
          if [ "$SMOKE" = "true" ]; then
            printed="$("./dist/$asset" --version)"
            echo "$printed"
            test "$printed" = "vson $VERSION"
          else
            echo "cross-compiled for $TARGET — this runner cannot execute it, so it is not smoke-tested."
          fi

          # Hashed here, where the bytes were produced, and verified again after
          # they have crossed the artifact store. macOS ships `shasum` and no
          # `sha256sum`; both write the same line in binary mode, which is the
          # line `sha256sum -c` reads on the other side.
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -b "$asset" > "$asset.sha256"
          else
            shasum -a 256 -b "$asset" > "$asset.sha256"
          fi
          cat "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload the built asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vson-${{ matrix.platform }}
          path: |
            dist/${{ env.ASSET }}
            dist/${{ env.ASSET }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach to the release
    # Only a tag publishes. A `workflow_dispatch` run stops after `build`,
    # which is what makes this workflow safe to exercise on a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # The one job that writes, and the only permission it is given.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Collect the built assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: vson-*
          merge-multiple: true

      - name: Verify the checksums, then write SHA256SUMS
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eo pipefail
          cd dist
          version="${REF_NAME#v}"

          # Named one by one rather than globbed: a matrix row that silently
          # stopped producing an artifact would otherwise publish a release
          # that is simply missing a platform, and nothing would say so.
          expected=(
            "vson-$version-macos-arm64"
            "vson-$version-macos-x86_64"
            "vson-$version-linux-x86_64"
            "vson-$version-windows-x86_64.exe"
          )
          for asset in "${expected[@]}"; do
            test -f "$asset" || { echo "::error::$asset is missing from the build artifacts."; exit 1; }
            sha256sum -c "$asset.sha256"
          done

          # One file, in the format `sha256sum -c` reads, in the matrix's order.
          rm -f SHA256SUMS
          for asset in "${expected[@]}"; do cat "$asset.sha256" >> SHA256SUMS; done
          rm -f -- *.sha256
          ls -l
          cat SHA256SUMS

      - name: Write the release notes
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eo pipefail
          version="${REF_NAME#v}"
          cat > notes.md <<EOF
          Binaries of the \`vson\` CLI for $REF_NAME. The changelog for this release is \`spec/CHANGELOG.md\` at this tag.

          | Asset | Platform | Built for |
          | --- | --- | --- |
          | \`vson-$version-macos-arm64\` | Apple silicon | \`aarch64-apple-darwin\` |
          | \`vson-$version-macos-x86_64\` | Intel Mac | \`x86_64-apple-darwin\` (cross-compiled) |
          | \`vson-$version-linux-x86_64\` | Linux | \`x86_64-unknown-linux-musl\`, statically linked |
          | \`vson-$version-windows-x86_64.exe\` | Windows | \`x86_64-pc-windows-msvc\` |

          Verify what you downloaded, then make it executable — a release asset is a byte stream and carries no file mode:

          \`\`\`bash
          sha256sum -c SHA256SUMS
          chmod +x vson-$version-*
          \`\`\`

          **These binaries are not self-contained with respect to Python.** They carry the ontology, the shapes and this repository's Python modules inside them, so they work with no checkout — but \`validate\`, \`verify\`, \`diff\` and \`mcp\` spawn \`python3\`, and \`validate\`'s first gate spawns the \`pyshacl\` console script:

          \`\`\`bash
          pip install pyshacl rdflib owlrl
          \`\`\`

          \`convert p2t\` and \`export cypher\` are native Rust and need nothing. \`cli/README.md\` draws the line exactly.

          macOS will refuse an unsigned downloaded binary until you clear the quarantine attribute (\`xattr -d com.apple.quarantine ./vson-$version-macos-arm64\`); these are not code-signed or notarized.

          Built by \`.github/workflows/release.yml\` from $GITHUB_SHA.
          EOF
          cat notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release edit "$REF_NAME" --notes-file notes.md
          else
            gh release create "$REF_NAME" --verify-tag --title "$REF_NAME" --notes-file notes.md
          fi
          # --clobber so a re-run after a fixed build replaces an asset instead
          # of failing on a name that is already there.
          gh release upload "$REF_NAME" --clobber dist/*
          gh release view "$REF_NAME" --json assets --jq '.assets[].name'
