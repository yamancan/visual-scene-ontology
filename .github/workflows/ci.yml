name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Ontology · Python · Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      # pyproject.toml pins the dependency ranges and installs the `tools`
      # package, so no sys.path juggling is needed. ruff powers `make lint-py`,
      # which runs as part of `make check`.
      - name: Install Python deps
        run: pip install -e ".[dev]" ruff

      # rustfmt + clippy are explicit: this action installs the minimal profile,
      # and `make cli-check` gates on `cargo fmt --check` and `cargo clippy`.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: cli

      # make check = parse-ontology + penman-roundtrip + shacl + owl-consistency
      #            + python tests + spec-check + fragment-check + registry-check
      #            + geometry-check + cq-check + grammar-check + conformance
      #            + lint-py (ruff) + iri-check
      - name: make check
        run: make check

      - name: make cli-check (fmt + clippy + Rust build + tests + graph-iso parity vs Python)
        run: make cli-check

      - name: make x-check (VSON-X round-trip parity)
        run: make x-check

      - name: make x-skill-check (VSON-X corpus conformance)
        run: make x-skill-check

      - name: make envelope-check (studio envelope corpus SHACL-conforms)
        run: make envelope-check

      # Not a verification of the repository, which is why `make site` is not in
      # the check chain — it is proof that the publish surface can still be
      # assembled from the tracked tree. build_site.py refuses to produce a
      # site/ whose Turtle does not parse, whose landing page states a version
      # the ontology does not declare, or which names the withdrawn namespace
      # host outside the one owl:priorVersion record. Running it here means a
      # deploy never discovers those on the day of the deploy.
      - name: make site (publish surface assembles and self-checks)
        run: make site

  # The composite action is a shipped artifact, so it is tested like one. Both
  # halves matter: a gate that never goes red is not a gate, and a gate that
  # goes red on a conformant corpus is worse than none.
  action:
    name: Composite action (gallery passes · a bad fixture fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # The action builds the CLI from source — no release binaries exist yet.
      # This is the cache its own header tells callers to add, exercised here so
      # the advice is tested rather than asserted.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: cli

      - name: The gallery must pass
        id: gallery
        uses: ./.github/actions/validate
        with:
          files: "examples/gallery/*.vson examples/throne_room.ttl"
          format: sarif
          report: vson-gallery.sarif

      - name: A clean run still produces a report
        run: |
          set -eo pipefail
          test "${{ steps.gallery.outputs.conformant }}" = "true"
          test "${{ steps.gallery.outputs.findings }}" = "0"
          python3 - <<'PY'
          import json
          log = json.load(open("vson-gallery.sarif"))
          # Not an empty file: a caller has to be able to tell "clean" from
          # "the tool never ran", and only a report can say the first.
          assert log["version"] == "2.1.0", log
          assert log["runs"][0]["tool"]["driver"]["name"] == "vson", log
          assert log["runs"][0]["results"] == [], log
          print("action self-test: 17 documents, zero results, a valid SARIF log.")
          PY

      # `continue-on-error` keeps the job alive; `outcome` still records what
      # the step did, which is what the next step asserts on. `annotate: false`
      # keeps a fixture that is *supposed* to fail from decorating the pull
      # request with an error nobody needs to act on.
      - name: A bad fixture must fail
        id: bad
        continue-on-error: true
        uses: ./.github/actions/validate
        with:
          files: tests/fixtures/bad_no_viewer.vson
          annotate: "false"
          report: vson-bad.json

      # Asserted off the report rather than off the step outputs: a composite
      # action whose step failed is not guaranteed to publish them, and the
      # file it wrote before failing is.
      - name: The failure must be the documented one
        run: |
          set -eo pipefail
          test "${{ steps.bad.outcome }}" = "failure"
          python3 - <<'PY'
          import json
          report = json.load(open("vson-bad.json"))
          finding = report["files"][0]["findings"][0]
          # The line is the assertion that matters: an annotation on the wrong
          # line is worse than no annotation, and this is the only place the
          # whole path — SHACL focus node, Penman variable, source offset,
          # workflow command — is exercised end to end.
          assert finding["location"]["line"] == 26, finding
          assert finding["rule"] == "vson/shacl/DirectionalNeedsViewerShape", finding
          assert report["files"][0]["gate"] == "shacl", report
          print("action self-test: the violation resolved to line 26 of the fixture.")
          PY

      - name: A glob that matches nothing must fail
        id: empty
        continue-on-error: true
        uses: ./.github/actions/validate
        with:
          files: "no/such/**/*.vson"

      - name: A gate that checks nothing is a failure
        run: test "${{ steps.empty.outcome }}" = "failure"

  web:
    name: Web studio (svelte-check · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm check

      - name: Lint (prettier + eslint)
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
