name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Ontology · Python · Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # pyproject.toml pins the dependency ranges and installs the `tools`
      # package, so no sys.path juggling is needed. ruff powers `make lint-py`,
      # which runs as part of `make check`.
      - name: Install Python deps
        run: pip install -e . ruff

      # rustfmt + clippy are explicit: this action installs the minimal profile,
      # and `make cli-check` gates on `cargo fmt --check` and `cargo clippy`.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      # make check = parse-ontology + penman-roundtrip + shacl + owl-consistency
      #            + python tests + spec-check + fragment-check + registry-check
      #            + geometry-check + cq-check + lint-py (ruff) + iri-check
      - name: make check
        run: make check

      - name: make cli-check (fmt + clippy + Rust build + tests + graph-iso parity vs Python)
        run: make cli-check

      - name: make x-check (VSON-X round-trip parity)
        run: make x-check

      - name: make x-skill-check (VSON-X corpus conformance)
        run: make x-skill-check

      - name: make envelope-check (studio envelope corpus SHACL-conforms)
        run: make envelope-check

      # Not a verification of the repository, which is why `make site` is not in
      # the check chain — it is proof that the publish surface can still be
      # assembled from the tracked tree. build_site.py refuses to produce a
      # site/ whose Turtle does not parse, whose landing page states a version
      # the ontology does not declare, or which names the withdrawn namespace
      # host outside the one owl:priorVersion record. Running it here means a
      # deploy never discovers those on the day of the deploy.
      - name: make site (publish surface assembles and self-checks)
        run: make site

  web:
    name: Web studio (svelte-check · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm check

      - name: Lint (prettier + eslint)
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
